services:
  postgres:
    image: postgres:18.6-alpine
    container_name: cxa-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: cxa_dev
      POSTGRES_PASSWORD: ${CXA_POSTGRES_PASSWORD:?Set CXA_POSTGRES_PASSWORD in .env.local}
      POSTGRES_USER: cxa_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cxa_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cxa_dev -d cxa_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cxa_postgres_data:
    name: cxa_postgres_data
